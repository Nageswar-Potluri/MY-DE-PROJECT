databricks_racing:
  target: dev

  outputs:

    # ── Feature / local development ───────────────────────────────────────────
    dev:
      type:      databricks
      catalog:   harness_stream
      schema:    gold_dev
      host:      "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token:     "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      threads:   4

    # ── CI / PR validation ────────────────────────────────────────────────────
    staging:
      type:      databricks
      catalog:   harness_stream
      schema:    gold_staging_ci
      host:      "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH_STAGING') }}"
      token:     "{{ env_var('DBT_DATABRICKS_TOKEN') }}"
      threads:   8

    # ── Production ────────────────────────────────────────────────────────────
    prod:
      type:      databricks
      catalog:   harness_stream
      schema:    gold
      host:      "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH_PROD') }}"
      token:     "{{ env_var('DBT_DATABRICKS_TOKEN_PROD') }}"
      threads:   16
