packages:
  # Core utility macros: generate_surrogate_key, date_spine, star, etc.
  - package: dbt-labs/dbt_utils
    version: [">=1.2.0", "<2.0.0"]

  # Great Expectations-style column-level tests (expect_column_values_to_be_between, etc.)
  - package: calogica/dbt_expectations
    version: [">=0.10.0", "<1.0.0"]

  # Date dimension generation helpers
  - package: dbt-labs/dbt_date
    version: [">=0.10.0", "<1.0.0"]

  # Compare model outputs across environments/versions during refactors
  - package: dbt-labs/audit_helper
    version: [">=0.12.0", "<1.0.0"]
